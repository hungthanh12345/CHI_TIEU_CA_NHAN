name: chi-tieu-ca-nhan

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Copy .env.example to .env and set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_DISABLE_POSTFIX: "1"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - edge

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_EXPORTER_USER:?Set POSTGRES_EXPORTER_USER in .env}
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_PASSWORD:?Set POSTGRES_EXPORTER_PASSWORD in .env}
    depends_on:
      postgres-exporter-init:
        condition: service_completed_successfully
    networks:
      - data
      - metrics

  postgres-exporter-init:
    image: postgres:17.11-alpine
    restart: "no"
    environment:
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:?Set POSTGRES_EXPORTER_USER in .env}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?Set POSTGRES_EXPORTER_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ "$$POSTGRES_EXPORTER_USER" = "$$DB_USER" ]; then
          echo "POSTGRES_EXPORTER_USER must be a separate role from DB_USER" >&2
          exit 1
        fi
        psql -h db -U "$$DB_USER" -d "$$DB_NAME" -v ON_ERROR_STOP=1 <<'SQL'
        \getenv exporter_user POSTGRES_EXPORTER_USER
        \getenv exporter_password POSTGRES_EXPORTER_PASSWORD
        \getenv database_name DB_NAME
        SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'exporter_user', :'exporter_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_catalog.pg_roles WHERE rolname = :'exporter_user')
        \gexec
        SELECT format('ALTER ROLE %I WITH LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS INHERIT', :'exporter_user', :'exporter_password')
        \gexec
        SELECT format('GRANT CONNECT ON DATABASE %I TO %I', :'database_name', :'exporter_user')
        \gexec
        SELECT format('GRANT pg_monitor TO %I', :'exporter_user')
        \gexec
        SQL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      COOKIE_SECURE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - proxy
      - data
      - metrics
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 25s

  cert-init:
    image: alpine:3.22.2
    restart: "no"
    volumes:
      - nginx_certs:/certs
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -s /certs/tls.crt ] || [ ! -s /certs/tls.key ]; then
          apk add --no-cache openssl
          openssl req -x509 -nodes -newkey rsa:3072 -sha256 -days 365 \
            -keyout /certs/tls.key -out /certs/tls.crt \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          chmod 600 /certs/tls.key
          chmod 644 /certs/tls.crt
        fi

  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${NGINX_HTTP_PORT:-8080}:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    networks:
      - edge
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 10s

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - proxy
      - metrics

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      app:
        condition: service_healthy
      nginx-exporter:
        condition: service_started
      postgres-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
    networks:
      - metrics

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - metrics

  loki:
    image: grafana/loki:3.6.11
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks:
      - logs

  promtail:
    image: grafana/promtail:3.6.11
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/promtail/promtail.yaml", "-config.expand-env=true"]
    environment:
      PROMTAIL_COMPOSE_PROJECT: ${PROMTAIL_COMPOSE_PROJECT:-chi-tieu-ca-nhan}
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/var/lib/promtail
    depends_on:
      loki:
        condition: service_started
    networks:
      - logs
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/9080; printf "GET /ready HTTP/1.0\r\n\r\n" >&3; IFS= read -r status <&3; [[ $$status == *"200 OK"* ]]'
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 20s

  # Legacy service kept only so an earlier Alloy container can be stopped
  # without deleting its volume. Never start this profile with Promtail.
  alloy:
    profiles: ["legacy-alloy"]
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    user: "0:0"
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    networks:
      - logs

  grafana:
    image: grafana/grafana:13.2.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001/
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - metrics
      - logs
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  edge:
    driver: bridge
  proxy:
    driver: bridge
  data:
    driver: bridge
    internal: true
  metrics:
    driver: bridge
    internal: true
  logs:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  pgadmin_data:
  nginx_certs:
  prometheus_data:
  loki_data:
  promtail_positions:
  alloy_data:
  grafana_data:
