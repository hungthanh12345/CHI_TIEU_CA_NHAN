name: chi-tieu-ca-nhan
services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Copy .env.example to .env and set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  pgadmin:
    image: dpage/pgadmin4:9.18
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in
        .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD
        in .env}
      PGADMIN_DISABLE_POSTFIX: '1'
    ports:
    - 127.0.0.1:5050:80
    volumes:
    - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
    - data
    - edge
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      COOKIE_SECURE: 'true'
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
    - proxy
    - data
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 25s
  cert-init:
    image: alpine:3.22.2
    restart: 'no'
    volumes:
    - nginx_certs:/certs
    entrypoint:
    - /bin/sh
    - -ec
    command:
    - "if [ ! -s /certs/tls.crt ] || [ ! -s /certs/tls.key ]; then\n  apk add --no-cache\
      \ openssl\n  openssl req -x509 -nodes -newkey rsa:3072 -sha256 -days 365 \\\n\
      \    -keyout /certs/tls.key -out /certs/tls.crt \\\n    -subj \"/CN=localhost\"\
      \ \\\n    -addext \"subjectAltName=DNS:localhost,IP:127.0.0.1\"\n  chmod 600\
      \ /certs/tls.key\n  chmod 644 /certs/tls.crt\nfi\n"
  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      cert-init:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:${NGINX_HTTP_PORT:-8080}:80
    - 127.0.0.1:8443:443
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    - nginx_certs:/etc/nginx/certs:ro
    networks:
    - edge
    - proxy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q --no-check-certificate -O /dev/null https://127.0.0.1/health/ready
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 10s
networks:
  edge:
    driver: bridge
  proxy:
    driver: bridge
  data:
    driver: bridge
volumes:
  postgres_data: null
  pgadmin_data: null
  nginx_certs: null
