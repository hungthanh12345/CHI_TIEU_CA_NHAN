server:
  http_listen_address: 0.0.0.0
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_project
        regex: ${PROMTAIL_COMPOSE_PROJECT}
        action: keep
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        regex: app|nginx|db
        action: keep
      - source_labels:
          - __meta_docker_container_label_com_docker_compose_service
        target_label: compose_service
      - target_label: job
        replacement: docker
    pipeline_stages:
      - match:
          selector: '{compose_service="app"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level:
