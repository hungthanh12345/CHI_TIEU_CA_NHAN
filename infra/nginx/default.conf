server {
    listen 80;
    server_name 192.168.195.129;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name 192.168.195.129;

    ssl_certificate /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 16k;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;

    location = /health/ready {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://app:3000/health/ready;
    }

    location = /metrics { return 404; }
    location ^~ /health/ { return 404; }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}

server {
    listen 8081;
    server_name 192.168.195.129;
    location = /stub_status {
        stub_status;
        access_log off;
    }
    location / { return 404; }
}
